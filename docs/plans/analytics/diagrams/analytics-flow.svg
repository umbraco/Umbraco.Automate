  <text class="band-title" x="36" y="258">Management API</text>
  <rect class="band" x="20" y="352" width="920" height="96" rx="8"/>
  <text class="band-title" x="36" y="374">Services</text>
  <rect class="band" x="20" y="468" width="920" height="96" rx="8"/>
  <text class="band-title" x="36" y="490">Persistence</text>
  <rect class="band" x="20" y="584" width="920" height="126" rx="8"/>
  <text class="band-title" x="36" y="606">Database</text>

  <g class="legend">
    <rect class="shape" x="684" y="28" width="240" height="24" rx="12"/>
    <text x="804" y="44">Highlighted = added by this feature</text>
  </g>

  <!-- Backoffice row 1 -->
  <g class="node new">
    <rect class="shape" x="40" y="66" width="200" height="52" rx="6"/>
    <text class="title" x="140" y="88">Analytics menu item</text>
    <text class="sub" x="140" y="106">new Monitoring menu</text>
  </g>
  <g class="node new">
    <rect class="shape" x="280" y="66" width="220" height="52" rx="6"/>
    <text class="title" x="390" y="88">ua-analytics-workspace</text>
    <text class="sub" x="390" y="106">header: workspace, dates</text>
  </g>
  <g class="node new">
