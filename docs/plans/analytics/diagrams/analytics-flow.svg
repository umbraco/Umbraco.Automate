    <text class="sub" x="390" y="186">tiles, chart, two tables</text>
  </g>
  <g class="node new">
    <rect class="shape" x="560" y="146" width="230" height="52" rx="6"/>
    <text class="title" x="675" y="168">UaAnalyticsServerDataSource</text>
    <text class="sub" x="675" y="186">generated API client</text>
  </g>
  <g class="node inactive">
    <rect class="shape" x="810" y="146" width="116" height="52" rx="6"/>
    <text class="title" x="868" y="168">Later views</text>
    <text class="sub" x="868" y="186">approvals, hours</text>
  </g>

  <!-- Backoffice edges -->
  <path class="edge new" d="M240,92 H280" marker-end="url(#arrow-new)"/>
  <text class="edge-label center" x="260" y="84">opens</text>
  <path class="edge new" d="M500,92 H560" marker-end="url(#arrow-new)"/>
