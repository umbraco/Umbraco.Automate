# Template: Generate SBOMs with umbraco-sbom, enforce license policy, upload to Dependency-Track
#
# Self-contained so it can be copied between repos that share the monorepo layout (Umbraco.AI,
# Umbraco.Automate): copy this file and .azure-pipelines/scripts/sbom/ unchanged, then call it
# from a job that has checked out the repo with full history (nbgv needs it for the version).
#
# Writes <product>-bom.xml for each product to the all-sboms pipeline artifact. A license policy
# violation fails the step; a Dependency-Track upload failure only warns, so it can't block a
# release. See scripts/sbom/generate-sbom.ps1 for how versions and isLatest are worked out.
#
# Parameters:
#   products: Comma-separated product folder names. Accepts a runtime macro such as
#             $(detect.AllChangedProducts).
#   upload:   Upload each SBOM to Dependency-Track. Needs DT_BASE_URL and DT_API_KEY variables
#             (the dependency-track variable group).
parameters:
    - name: products
      type: string
    - name: upload
      type: boolean
      default: false

steps:
    - task: UseDotNet@2
      displayName: Setup .NET
      inputs:
          useGlobalJson: true

    - task: UseNode@1
      displayName: Setup Node.js
      inputs:
          version: $(NODE_VERSION)

    # Installed fresh every build so the centrally maintained license overrides are current.
    - script: |
          dotnet tool install --global nbgv
          dotnet tool install --global Umbraco.Internal.Sbom
      displayName: Install nbgv and umbraco-sbom

    - task: PowerShell@2
      displayName: Generate SBOMs
      inputs:
          filePath: .azure-pipelines/scripts/sbom/generate-sbom.ps1
          pwsh: true
          ${{ if parameters.upload }}:
              arguments: -Products "${{ parameters.products }}" -OutputDir "$(Build.ArtifactStagingDirectory)/sbom" -Upload
          ${{ else }}:
              arguments: -Products "${{ parameters.products }}" -OutputDir "$(Build.ArtifactStagingDirectory)/sbom"
      env:
          DT_BASE_URL: $(DT_BASE_URL)
          DT_API_KEY: $(DT_API_KEY)

    - task: PublishPipelineArtifact@1
      displayName: Upload SBOM artifact
      condition: succeededOrFailed()
      inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/sbom
          artifact: all-sboms
          publishLocation: pipeline
