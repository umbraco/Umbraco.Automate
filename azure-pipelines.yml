# Azure DevOps CI Pipeline for Umbraco.Automate
#
# The stages, and when each runs, come from Umbraco.Build's shared monorepo template:
# https://github.com/umbraco/Umbraco.Build/tree/main/devops/monorepo
# This file holds what is Automate's own: its products, its queue-time switches, its triggers and
# its acceptance test settings.

parameters:
    # ============================================================
    # Product Definitions - UPDATE HERE WHEN ADDING NEW PACKAGES
    # ============================================================
    # Tiers in dependency order. A tier is packed after every lower tier, against what they packed
    # in the same run. change_var is the variable change detection sets for the product.
    - name: tiers
      type: object
      default:
          - level: 0
            products:
                - name: Umbraco.Automate
                  change_var: CoreChanged
                  has_npm: false
          - level: 1
            products:
                # OpenIddict (OAuth infrastructure - no frontend)
                - name: Umbraco.Automate.OpenIddict
                  change_var: OpeniddictChanged
                  has_npm: false
          - level: 2
            products:
                # Slack (depends on OpenIddict - no frontend)
                - name: Umbraco.Automate.Slack
                  change_var: SlackChanged
                  has_npm: false

    # Queue-time choice: where to publish this run's packages. Nothing publishes on a push; queue a
    # run (by hand or with `az pipelines run --parameters publish=<value>`) to publish.
    #   nightly    - MyGet nightly feed
    #   prerelease - MyGet prereleases feed
    #   release    - NuGet.org after approval in the "Umbraco Automate Release" environment, then
    #                <product>@<version> tags and a GitHub release. vN/release/* and vN/hotfix/* only.
    - name: publish
      displayName: Publish packages to
      type: string
      default: none
      values:
          - none
          - nightly
          - prerelease
          - release

    # Queue-time override: pack every product regardless of what changed, and allow packing from a
    # vN/feature/* branch (with project references, as vN/dev packs).
    - name: forcePackAll
      displayName: Pack all products (allows packing a feature branch)
      type: boolean
      default: false

    # Queue-time override: pack dev builds with NuGet version ranges instead of project references.
    - name: packWithNuGetRanges
      displayName: Pack with NuGet version ranges (dev only override)
      type: boolean
      default: false

    # Queue-time override: generate SBOMs and run the license policy check on any branch.
    # SBOMs normally only run on vN/release/* and vN/hotfix/*, where they are also uploaded to
    # Dependency-Track. Elsewhere this covers every product and never uploads, so in-progress
    # versions don't land in Dependency-Track.
    - name: generateSbom
      displayName: Generate SBOMs and check licenses (no upload off release/hotfix)
      type: boolean
      default: false

    # Which tests run: the same choice as the main Umbraco.Build template.
    #   auto  - Linux on every run; Windows and macOS too on vN/release/* and vN/hotfix/*
    #   force - Linux, Windows and macOS on any branch
    #   skip  - no tests (e.g. to check packing while a test is flaky); refused with publish=release
    - name: runTests
      displayName: Test
      type: string
      default: auto
      values:
          - auto
          - force
          - skip

# Feature branches are not listed: their pull request builds them, and a branch
# trigger as well would build every push twice.
# batch: a burst of merges builds once, from the latest commit, rather than once per merge.
trigger:
    batch: true
    branches:
        include:
            - v*/main
            - v*/dev
            - v*/release/*
            - v*/hotfix/*

pr:
    branches:
        include:
            - v*/main
            - v*/dev

resources:
    repositories:
        - repository: build
          type: github
          name: umbraco/Umbraco.Build
          ref: refs/heads/main
          endpoint: umbraco

variables:
    - name: DOTNET_NOLOGO
      value: "true"
    - name: DOTNET_CLI_TELEMETRY_OPTOUT
      value: "true"

extends:
    template: devops/monorepo/templates/pipeline.yml@build
    parameters:
        core_product: Umbraco.Automate
        solution: Umbraco.Automate.slnx
        tiers: ${{ parameters.tiers }}
        node_version: 24.x
        dt_variable_group: dependency-track
        force_pack_all: ${{ parameters.forcePackAll }}
        pack_with_nuget_ranges: ${{ parameters.packWithNuGetRanges }}
        generate_sbom: ${{ parameters.generateSbom }}
        run_tests: ${{ parameters.runTests }}
        publish: ${{ parameters.publish }}
        # Automate publishes no npm packages
        nightly_npm_connection: ''
        prerelease_npm_connection: ''
        release_npm_connection: ''
        release_environment: Umbraco Automate Release
        release_variable_group: umbraco-automate-release

        # Playwright end-to-end tests against the demo site, on Windows + SQL Server LocalDB.
        # Automate shares the CMS connection string (Umbraco:Automate:UseNamedConnectionString =
        # umbracoDbDSN), so the stage's LocalDB connection string moves Automate onto it too.
        acceptance_tests:
            tests_dir: Umbraco.Automate/tests/Umbraco.Automate.Tests.AcceptanceTests
            demo_project_file: Umbraco.Automate.DemoSite.csproj
            # A PR that only touches these never runs the suite: docs, repo tooling, the dotnet new
            # templates (not scripts/templates/), changelog and release tooling, marketplace JSON.
            skip_paths:
                - "*.md"
                - "docs/*"
                - ".claude/*"
                - ".github/*"
                - ".githooks/*"
                - "assets/*"
                - "templates/*"
                - "LICENSE"
                - "commitlint.config.js"
                - ".git-blame-ignore-revs"
                - ".prettierrc"
                - ".prettierignore"
                - ".mcp.json"
                - ".worktreeinclude"
                - "*/changelog.config.json"
                - "*/umbraco-marketplace*.json"
                - "scripts/generate-changelog*"
                - "scripts/generate-release-manifest*"
                - "scripts/list-commit-options.js"
                - "scripts/setup-git-hooks*"
            # The .NET test projects: Build runs them.
            test_paths:
                - "Umbraco.Automate/tests/Umbraco.Automate.Tests.Unit/*"
                - "Umbraco.Automate/tests/Umbraco.Automate.Tests.Integration/*"
                - "Umbraco.Automate/tests/Umbraco.Automate.Tests.Common/*"
                - "Umbraco.Automate/tests/Directory.*"
                - "Umbraco.Automate.OpenIddict/tests/*"
                - "Umbraco.Automate.Slack/tests/*"
