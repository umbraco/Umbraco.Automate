# Azure DevOps CI Pipeline for Umbraco.Automate
# Adapted from Umbraco.AI pipeline

# ============================================================
# Product Definitions - UPDATE HERE WHEN ADDING NEW PACKAGES
# ============================================================
# Level 0: Core package (no internal dependencies)
# Level 1: All packages that depend on Core
# Level 2: All packages that depend on Level 1 packages
parameters:
    - name: level1Products
      type: object
      default:
          # OpenIddict (OAuth infrastructure - no frontend)
          - name: Umbraco.Automate.OpenIddict
            changeVar: OpeniddictChanged
            hasNpm: false
    - name: level2Products
      type: object
      default:
          # Slack (depends on OpenIddict - no frontend)
          - name: Umbraco.Automate.Slack
            changeVar: SlackChanged
            hasNpm: false

# Feature branches are not listed: their pull request builds them, and a branch
# trigger as well would build every push twice.
# batch: a burst of merges builds once, from the latest commit, rather than once per merge.
trigger:
    batch: true
    branches:
        include:
            - v*/main
            - v*/dev
            - v*/release/*
            - v*/hotfix/*

pr:
    branches:
        include:
            - v*/main
            - v*/dev

variables:
    - group: dependency-track
    - name: NODE_VERSION
      value: "24.x"
    - name: DOTNET_NOLOGO
      value: "true"
    - name: DOTNET_CLI_TELEMETRY_OPTOUT
      value: "true"
    # A push to vN/main, vN/dev, vN/release/* or vN/hotfix/*: the builds that publish SBOMs and packages.
    # Resolves to "True" or "False" at compile time; eq() compares case-insensitively.
    - name: isPublishBuild
      value: ${{ and(ne(variables['Build.Reason'], 'PullRequest'), or(contains(variables['Build.SourceBranch'], '/release/'), contains(variables['Build.SourceBranch'], '/hotfix/'), endsWith(variables['Build.SourceBranch'], '/main'), endsWith(variables['Build.SourceBranch'], '/dev'))) }}

stages:
    # ============================================================
    # Build & Test everything
    # ============================================================
    - stage: Build
      displayName: Build & Test
      jobs:
          - job: BuildAndTest
            displayName: Build & Test
            pool:
                vmImage: "ubuntu-latest"
            variables:
                NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
                npm_config_cache: $(Pipeline.Workspace)/.npm
            steps:
                - checkout: self
                  fetchDepth: 0

                # Set here rather than in a stage of its own, which cost an extra agent and
                # its wait on every build. Safe to set early: every version.json disables
                # nbgv's cloud build number, so the Pack stage's `nbgv cloud` leaves it alone.
                - task: Bash@3
                  displayName: Set build number (branch + date)
                  inputs:
                      targetType: inline
                      script: |
                          BUILD_DATE=$(date -u +%Y%m%d)
                          echo "##vso[build.updatebuildnumber]$(Build.SourceBranchName)-${BUILD_DATE}-$(Build.BuildID)"

                # Change detection runs here rather than as the first job of the Pack stage,
                # which cost an agent and its wait before any packing could start. It only
                # reads git history, so it runs before the build touches the working tree.
                # The Pack stage reads its outputs via stageDependencies.
                - task: PowerShell@2
                  displayName: Run change detection
                  name: detect
                  condition: and(succeeded(), eq(variables.isPublishBuild, 'True'))
                  inputs:
                      filePath: .azure-pipelines/scripts/detect-changes.ps1
                      pwsh: true
                  env:
                      # Required by Get-LastSuccessfulBuildCommit to query the Azure DevOps REST API
                      # for the previous successful build's source version on this branch.
                      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

                - task: Bash@3
                  displayName: Summarize packed products + tag build
                  condition: and(succeeded(), eq(variables.isPublishBuild, 'True'))
                  inputs:
                      targetType: inline
                      script: |
                          PRODUCTS="$(detect.AllChangedProducts)"
                          ANY="$(detect.AnyChanged)"
                          MAX_LEVEL="$(detect.MaxLevel)"

                          if [ -z "$PRODUCTS" ]; then
                            PRODUCTS="(none)"
                          fi

                          SUMMARY_FILE="$(Build.ArtifactStagingDirectory)/pack-summary.md"
                          {
                            echo "## Pack Summary"
                            echo ""
                            echo "- AnyChanged: ${ANY:-false}"
                            echo "- MaxLevel: ${MAX_LEVEL:-0}"
                            echo "- CoreChanged: $(detect.CoreChanged)"
                            echo "- Products: ${PRODUCTS}"
                            echo ""
                            echo "Artifacts (if produced):"
                            echo "- all-nuget-packages"
                            echo "- all-npm-packages"
                          } > "$SUMMARY_FILE"

                          echo "##vso[task.uploadsummary]$SUMMARY_FILE"

                          if [ "$PRODUCTS" = "(none)" ]; then
                            echo "##vso[build.addbuildtag]pack-none"
                            exit 0
                          fi

                          if [ "$(detect.CoreChanged)" = "true" ]; then
                            echo "##vso[build.addbuildtag]pack-core"
                          fi

                          IFS=',' read -ra ITEMS <<< "$PRODUCTS"
                          for item in "${ITEMS[@]}"; do
                            trimmed="$(echo "$item" | xargs)"
                            if [ -n "$trimmed" ]; then
                              name="$trimmed"
                              if [[ "$name" == Umbraco.Automate.* ]]; then
                                name="${name#Umbraco.Automate.}"
                              elif [[ "$name" == Umbraco.Automate ]]; then
                                name="core"
                              fi
                              safe="$(echo "$name" | tr '[:upper:]' '[:lower:]' | tr '.' '-' | tr -cd 'a-z0-9-')"
                              echo "##vso[build.addbuildtag]pack-$safe"
                            fi
                          done

                - task: UseDotNet@2
                  displayName: Setup .NET
                  inputs:
                      useGlobalJson: true

                - task: UseNode@1
                  displayName: Setup Node.js
                  inputs:
                      version: $(NODE_VERSION)

                # PR builds read the cache saved by their target branch's builds.
                - task: Cache@2
                  displayName: Cache npm
                  inputs:
                      key: 'npm | "$(Agent.OS)" | package-lock.json'
                      restoreKeys: |
                          npm | "$(Agent.OS)"
                      path: $(npm_config_cache)

                # No packages.lock.json in this repo, so key on the central version file
                # plus every project file.
                - task: Cache@2
                  displayName: Cache NuGet packages
                  inputs:
                      key: 'nuget | "$(Agent.OS)" | Directory.Packages.props | **/*.csproj'
                      restoreKeys: |
                          nuget | "$(Agent.OS)"
                      path: $(NUGET_PACKAGES)

                - script: |
                      npm ci --include=optional
                      npm run build
                  displayName: Build frontend

                - script: dotnet restore Umbraco.Automate.slnx
                  displayName: Restore

                - script: dotnet build Umbraco.Automate.slnx --configuration Release --no-restore -p:DisableCloudBuildNumber=true
                  displayName: Build

                - script: dotnet test Umbraco.Automate.slnx --configuration Release --no-build --verbosity normal --logger trx --results-directory $(Agent.TempDirectory)/TestResults
                  displayName: Test

                - task: PublishTestResults@2
                  displayName: Publish test results
                  condition: always()
                  inputs:
                      testResultsFormat: VSTest
                      testResultsFiles: "$(Agent.TempDirectory)/TestResults/**/*.trx"
                      mergeTestResults: true

                # .artifactignore at the repo root keeps .git and node_modules out of this
                # artifact: the Pack jobs check out the repo themselves and don't need them.
                - task: PublishPipelineArtifact@1
                  displayName: Upload build outputs
                  inputs:
                      targetPath: $(Build.SourcesDirectory)
                      artifact: build-outputs
                      publishLocation: pipeline

    # ============================================================
    # Generate & Upload SBOMs - Only runs on push to vN/main, vN/dev, vN/hotfix/*, vN/release/*
    # Generates per-product SBOMs and uploads to Dependency-Track
    # ============================================================
    - stage: GenerateSBOM
      displayName: Generate & Upload SBOMs
      dependsOn: Build
      condition: and(succeeded(), eq(variables.isPublishBuild, 'True'))
      jobs:
          # One job for every product: each SBOM takes about a minute, far less than the
          # agent wait a job per product cost, and cdxgen is installed once, not per product.
          - job: GenerateSBOMs
            displayName: Generate SBOMs
            continueOnError: true
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self
                  fetchDepth: 1

                - task: UseNode@1
                  displayName: Setup Node.js
                  inputs:
                      version: $(NODE_VERSION)

                - task: Npm@1
                  displayName: Install cdxgen
                  inputs:
                      command: custom
                      customCommand: install --global @cyclonedx/cdxgen

                - template: .azure-pipelines/templates/generate-sbom.yml
                  parameters:
                      product: Umbraco.Automate

                - ${{ each product in parameters.level1Products }}:
                      - template: .azure-pipelines/templates/generate-sbom.yml
                        parameters:
                            product: ${{ product.name }}

                - ${{ each product in parameters.level2Products }}:
                      - template: .azure-pipelines/templates/generate-sbom.yml
                        parameters:
                            product: ${{ product.name }}

                - task: PublishPipelineArtifact@1
                  displayName: Upload combined SBOM artifact
                  condition: succeededOrFailed()
                  inputs:
                      targetPath: $(Build.ArtifactStagingDirectory)/sbom
                      artifact: all-sboms
                      publishLocation: pipeline

    # ============================================================
    # Validate Changelogs - Only runs on release and hotfix branches
    # Ensures CHANGELOGs are present and match version.json
    # Runs in parallel with GenerateSBOM after Build
    # ============================================================
    - stage: ValidateChangelogs
      displayName: Validate Changelogs
      dependsOn: Build
      # Only validate on release and hotfix branches (not main or dev)
      condition: |
          and(
            succeeded(),
            ne(variables['Build.Reason'], 'PullRequest'),
            or(
              contains(variables['Build.SourceBranch'], '/release/'),
              contains(variables['Build.SourceBranch'], '/hotfix/')
            )
          )
      jobs:
          - job: ValidateChangelogFiles
            displayName: Validate CHANGELOG.md Files
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self
                  fetchDepth: 0

                - task: PowerShell@2
                  displayName: Validate changelogs
                  inputs:
                      filePath: .azure-pipelines/scripts/validate-changelogs.ps1
                      pwsh: true
                      failOnStderr: false

    # ============================================================
    # Pack Stage - Only runs on push to vN/main, vN/dev, vN/hotfix/*, vN/release/* branches
    # Uses dynamic change detection to only pack products that changed
    # Runs in parallel with GenerateSBOM after Build (through ValidateChangelogs dependency)
    # ============================================================
    - stage: Pack
      displayName: Pack NuGet & NPM Packages
      dependsOn:
          - Build
          - ValidateChangelogs
      # Only pack on push (not PR) to vN/main, vN/dev, vN/hotfix/*, vN/release/* branches,
      # and only when change detection (in the Build job) found something to pack.
      # ValidateChangelogs may be skipped (on vN/main, vN/dev branches), which is OK
      condition: |
          and(
            in(dependencies.Build.result, 'Succeeded'),
            in(dependencies.ValidateChangelogs.result, 'Succeeded', 'Skipped'),
            eq(variables.isPublishBuild, 'True'),
            eq(dependencies.Build.outputs['BuildAndTest.detect.AnyChanged'], 'true')
          )
      jobs:
          # ============================================================
          # Pack Core (Level 0 - no internal dependencies)
          # Conditional based on change detection
          # ============================================================
          - job: PackCore
            displayName: Pack Umbraco.Automate
            condition: eq(stageDependencies.Build.BuildAndTest.outputs['detect.CoreChanged'], 'true')
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self
                  fetchDepth: 0

                - task: UseDotNet@2
                  displayName: Setup .NET
                  inputs:
                      useGlobalJson: true

                - task: DownloadPipelineArtifact@2
                  displayName: Download build outputs
                  inputs:
                      artifact: build-outputs
                      path: $(Build.SourcesDirectory)

                - template: .azure-pipelines/templates/pack-product.yml
                  parameters:
                      product: Umbraco.Automate
                      # Use project references on vN/dev (preview releases), NuGet packages on vN/release, vN/hotfix, vN/main (validate ranges)
                      useProjectReferences: ${{ endsWith(variables['Build.SourceBranch'], '/dev') }}

                - template: .azure-pipelines/templates/upload-packages.yml
                  parameters:
                      product: Umbraco.Automate

          # ============================================================
          # Pack Level 1 (OpenIddict - depends on Core)
          # Matrix generated from parameters.level1Products
          # ============================================================
          - job: PackLevel1
            displayName: Pack Level 1
            dependsOn:
                - PackCore
            condition: |
                and(
                  not(failed()),
                  not(canceled()),
                  eq(stageDependencies.Build.BuildAndTest.outputs['detect.Level1Changed'], 'true')
                )
            pool:
                vmImage: "ubuntu-latest"
            strategy:
                matrix:
                    # Generated from parameters.level1Products
                    ${{ each product in parameters.level1Products }}:
                        ${{ replace(replace(product.name, 'Umbraco.Automate.', ''), '.', '_') }}:
                            product: ${{ product.name }}
                            changeVar: ${{ product.changeVar }}
                maxParallel: 10
            variables:
                # Pass all per-product change flags as job variables
                CoreChanged: $[ stageDependencies.Build.BuildAndTest.outputs['detect.CoreChanged'] ]
                ${{ each product in parameters.level1Products }}:
                    ${{ product.changeVar }}: $[ stageDependencies.Build.BuildAndTest.outputs['detect.${{ product.changeVar }}'] ]
            steps:
                - checkout: self
                  fetchDepth: 0

                - template: .azure-pipelines/templates/check-should-pack.yml

                - template: .azure-pipelines/templates/setup-pack-job.yml
                  parameters:
                      downloadCore: true
                      downloadLevel1: false

                - template: .azure-pipelines/templates/pack-product.yml
                  parameters:
                      product: $(product)
                      # Use project references on vN/dev (preview releases), NuGet packages on vN/release, vN/hotfix, vN/main (validate ranges)
                      useProjectReferences: ${{ endsWith(variables['Build.SourceBranch'], '/dev') }}
                      condition: eq(variables['check.shouldPack'], 'true')

                - template: .azure-pipelines/templates/upload-packages.yml
                  parameters:
                      product: $(product)
                      condition: eq(variables['check.shouldPack'], 'true')

          # ============================================================
          # Pack Level 2 (Slack - depends on OpenIddict)
          # Matrix generated from parameters.level2Products
          # ============================================================
          - job: PackLevel2
            displayName: Pack Level 2
            dependsOn:
                - PackCore
                - PackLevel1
            condition: |
                and(
                  not(failed()),
                  not(canceled()),
                  eq(stageDependencies.Build.BuildAndTest.outputs['detect.Level2Changed'], 'true')
                )
            pool:
                vmImage: "ubuntu-latest"
            strategy:
                matrix:
                    # Generated from parameters.level2Products
                    ${{ each product in parameters.level2Products }}:
                        ${{ replace(replace(product.name, 'Umbraco.Automate.', ''), '.', '_') }}:
                            product: ${{ product.name }}
                            changeVar: ${{ product.changeVar }}
                maxParallel: 10
            variables:
                # Pass all per-product change flags as job variables
                CoreChanged: $[ stageDependencies.Build.BuildAndTest.outputs['detect.CoreChanged'] ]
                ${{ each product in parameters.level1Products }}:
                    ${{ product.changeVar }}: $[ stageDependencies.Build.BuildAndTest.outputs['detect.${{ product.changeVar }}'] ]
                ${{ each product in parameters.level2Products }}:
                    ${{ product.changeVar }}: $[ stageDependencies.Build.BuildAndTest.outputs['detect.${{ product.changeVar }}'] ]
            steps:
                - checkout: self
                  fetchDepth: 0

                - template: .azure-pipelines/templates/check-should-pack.yml

                - template: .azure-pipelines/templates/setup-pack-job.yml
                  parameters:
                      downloadCore: true
                      downloadLevel1: true
                      level1Products: ${{ parameters.level1Products }}

                - template: .azure-pipelines/templates/pack-product.yml
                  parameters:
                      product: $(product)
                      # Use project references on vN/dev (preview releases), NuGet packages on vN/release, vN/hotfix, vN/main (validate ranges)
                      useProjectReferences: ${{ endsWith(variables['Build.SourceBranch'], '/dev') }}
                      condition: eq(variables['check.shouldPack'], 'true')

                - template: .azure-pipelines/templates/upload-packages.yml
                  parameters:
                      product: $(product)
                      condition: eq(variables['check.shouldPack'], 'true')

          # ============================================================
          # Collect all packages into single artifact
          # Downloads artifacts from all pack jobs
          # ============================================================
          - job: CollectPackages
            displayName: Collect All Packages
            dependsOn:
                - PackCore
                - PackLevel1
                - PackLevel2
            condition: |
                and(
                  not(failed()),
                  not(canceled()),
                  eq(stageDependencies.Build.BuildAndTest.outputs['detect.AnyChanged'], 'true')
                )
            pool:
                vmImage: "ubuntu-latest"
            variables:
                # Map dependency outputs to job variables (dependencies context only works at job level)
                CoreChanged: $[ stageDependencies.Build.BuildAndTest.outputs['detect.CoreChanged'] ]
                ${{ each product in parameters.level1Products }}:
                    ${{ product.changeVar }}: $[ stageDependencies.Build.BuildAndTest.outputs['detect.${{ product.changeVar }}'] ]
                ${{ each product in parameters.level2Products }}:
                    ${{ product.changeVar }}: $[ stageDependencies.Build.BuildAndTest.outputs['detect.${{ product.changeVar }}'] ]
            steps:
                - checkout: self
                  fetchDepth: 0

                # Download Core NuGet packages (only if Core changed)
                - task: DownloadPipelineArtifact@2
                  displayName: Download Umbraco.Automate NuGet packages
                  condition: eq(variables.CoreChanged, 'true')
                  inputs:
                      artifact: "Umbraco.Automate-packages"
                      targetPath: "$(Pipeline.Workspace)/nuget"

                # Download Level 1 NuGet packages (only if product changed)
                - ${{ each product in parameters.level1Products }}:
                      - task: DownloadPipelineArtifact@2
                        displayName: Download ${{ product.name }} NuGet packages
                        condition: eq(variables.${{ product.changeVar }}, 'true')
                        inputs:
                            artifact: "${{ product.name }}-packages"
                            targetPath: "$(Pipeline.Workspace)/nuget"

                # Download Level 1 npm packages (only for products that have npm packages)
                - ${{ each product in parameters.level1Products }}:
                      - ${{ if eq(product.hasNpm, true) }}:
                            - task: DownloadPipelineArtifact@2
                              displayName: Download ${{ product.name }} npm packages
                              condition: eq(variables.${{ product.changeVar }}, 'true')
                              inputs:
                                  artifact: "${{ product.name }}-npm-packages"
                                  targetPath: "$(Pipeline.Workspace)/npm"

                # Download Level 2 NuGet packages (only if product changed)
                - ${{ each product in parameters.level2Products }}:
                      - task: DownloadPipelineArtifact@2
                        displayName: Download ${{ product.name }} NuGet packages
                        condition: eq(variables.${{ product.changeVar }}, 'true')
                        inputs:
                            artifact: "${{ product.name }}-packages"
                            targetPath: "$(Pipeline.Workspace)/nuget"

                # Download Level 2 npm packages (only for products that have npm packages)
                - ${{ each product in parameters.level2Products }}:
                      - ${{ if eq(product.hasNpm, true) }}:
                            - task: DownloadPipelineArtifact@2
                              displayName: Download ${{ product.name }} npm packages
                              condition: eq(variables.${{ product.changeVar }}, 'true')
                              inputs:
                                  artifact: "${{ product.name }}-npm-packages"
                                  targetPath: "$(Pipeline.Workspace)/npm"

                - task: PowerShell@2
                  displayName: Build pack manifest (projects -> version)
                  name: buildManifest
                  inputs:
                      targetType: inline
                      pwsh: true
                      script: |
                          $manifestDir = Join-Path $env:BUILD_SOURCESDIRECTORY "artifacts"
                          $manifestFile = Join-Path $manifestDir "pack-manifest.json"
                          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null

                          $entries = New-Object System.Collections.Generic.List[object]
                          $packages = @()
                          $nugetRoot = Join-Path $env:PIPELINE_WORKSPACE "nuget"

                          if (Test-Path $nugetRoot) {
                            Add-Type -AssemblyName System.IO.Compression.FileSystem
                            $files = Get-ChildItem -Path $nugetRoot -Recurse -Filter "*.nupkg" -File
                            foreach ($f in $files) {
                              $zip = [System.IO.Compression.ZipFile]::OpenRead($f.FullName)
                              try {
                                $nuspecEntry = $zip.Entries | Where-Object { $_.FullName -like "*.nuspec" } | Select-Object -First 1
                                if ($null -ne $nuspecEntry) {
                                  $reader = New-Object System.IO.StreamReader($nuspecEntry.Open())
                                  try {
                                    $xml = [xml]$reader.ReadToEnd()
                                  } finally {
                                    $reader.Close()
                                  }
                                  $id = $xml.package.metadata.id
                                  $version = $xml.package.metadata.version
                                  if ($id -and $version) {
                                    $packages += [pscustomobject]@{ id = $id; version = $version }
                                  }
                                }
                              } finally {
                                $zip.Dispose()
                              }
                            }
                          }

                          function Add-VersionByProduct {
                            param([string]$Product)
                            $match = $packages | Where-Object { $_.id -eq $Product } | Select-Object -First 1
                            if (-not $match) {
                              $match = $packages | Where-Object { $_.id -like "$Product.*" } | Select-Object -First 1
                            }
                            if ($match) {
                              $entries.Add([pscustomobject]@{ name = $Product; version = $match.version })
                            }
                          }

                          if ("$(CoreChanged)" -eq "true") {
                            Add-VersionByProduct "Umbraco.Automate"
                          }

                          $level1 = $env:LEVEL1_JSON | ConvertFrom-Json
                          foreach ($p in $level1) {
                            $changeVar = [string]$p.changeVar
                            $changed = [Environment]::GetEnvironmentVariable($changeVar)
                            if (-not $changed) {
                              $changed = [Environment]::GetEnvironmentVariable($changeVar.ToUpper())
                            }
                            if ($changed -eq "true") {
                              Add-VersionByProduct $p.name
                            }
                          }

                          $level2 = $env:LEVEL2_JSON | ConvertFrom-Json
                          foreach ($p in $level2) {
                            $changeVar = [string]$p.changeVar
                            $changed = [Environment]::GetEnvironmentVariable($changeVar)
                            if (-not $changed) {
                              $changed = [Environment]::GetEnvironmentVariable($changeVar.ToUpper())
                            }
                            if ($changed -eq "true") {
                              Add-VersionByProduct $p.name
                            }
                          }

                          $json = $entries | ConvertTo-Json -Depth 3
                          $json | Out-File -FilePath $manifestFile -Encoding utf8
                          Write-Host "Pack manifest written to $manifestFile"
                          Write-Host $json
                  env:
                      LEVEL1_JSON: ${{ convertToJson(parameters.level1Products) }}
                      LEVEL2_JSON: ${{ convertToJson(parameters.level2Products) }}

                - task: PublishPipelineArtifact@1
                  displayName: Upload pack manifest
                  inputs:
                      targetPath: $(Build.SourcesDirectory)/artifacts/pack-manifest.json
                      artifact: pack-manifest
                      publishLocation: pipeline

                # Flatten and collect NuGet packages
                - task: Bash@3
                  displayName: Collect NuGet packages
                  name: collectNuget
                  inputs:
                      targetType: inline
                      script: |
                          mkdir -p all-nuget-packages

                          # Find all .nupkg and .snupkg files and move to single directory (only if source dir exists)
                          if [ -d "$(Pipeline.Workspace)/nuget" ]; then
                            find "$(Pipeline.Workspace)/nuget" -name "*.nupkg" -exec mv {} all-nuget-packages/ \; 2>/dev/null || true
                            find "$(Pipeline.Workspace)/nuget" -name "*.snupkg" -exec mv {} all-nuget-packages/ \; 2>/dev/null || true
                          fi

                          # Check if any packages were collected
                          if [ -d "all-nuget-packages" ] && [ "$(ls -A all-nuget-packages 2>/dev/null)" ]; then
                            echo "##vso[task.setvariable variable=hasNugetPackages;isOutput=true]true"
                            echo "Collected NuGet packages:"
                            ls -la all-nuget-packages/
                          else
                            echo "##vso[task.setvariable variable=hasNugetPackages;isOutput=true]false"
                            echo "No NuGet packages collected"
                          fi

                # Flatten and collect npm packages
                - task: Bash@3
                  displayName: Collect npm packages
                  name: collectNpm
                  inputs:
                      targetType: inline
                      script: |
                          mkdir -p all-npm-packages

                          # Find all .tgz files and move to single directory (only if source dir exists)
                          if [ -d "$(Pipeline.Workspace)/npm" ]; then
                            find "$(Pipeline.Workspace)/npm" -name "*.tgz" -exec mv {} all-npm-packages/ \; 2>/dev/null || true
                          fi

                          # Check if any packages were collected
                          if [ -d "all-npm-packages" ] && [ "$(ls -A all-npm-packages 2>/dev/null)" ]; then
                            echo "##vso[task.setvariable variable=hasNpmPackages;isOutput=true]true"
                            echo "Collected npm packages:"
                            ls -la all-npm-packages/
                          else
                            echo "##vso[task.setvariable variable=hasNpmPackages;isOutput=true]false"
                            echo "No npm packages collected"
                          fi

                - task: PublishPipelineArtifact@1
                  displayName: Upload combined NuGet artifact
                  condition: eq(variables['collectNuget.hasNugetPackages'], 'true')
                  inputs:
                      targetPath: $(Build.SourcesDirectory)/all-nuget-packages
                      artifact: all-nuget-packages
                      publishLocation: pipeline

                - task: PublishPipelineArtifact@1
                  displayName: Upload combined npm artifact
                  condition: eq(variables['collectNpm.hasNpmPackages'], 'true')
                  inputs:
                      targetPath: $(Build.SourcesDirectory)/all-npm-packages
                      artifact: all-npm-packages
                      publishLocation: pipeline

