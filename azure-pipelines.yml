# Azure DevOps CI Pipeline for Umbraco.Automate
# Adapted from Umbraco.AI pipeline

# ============================================================
# Product Definitions - UPDATE HERE WHEN ADDING NEW PACKAGES
# ============================================================
# Level 0: Core package (no internal dependencies)
# Level 1: All packages that depend on Core
# Level 2: All packages that depend on Level 1 packages
parameters:
    - name: level1Products
      type: object
      default:
          # OpenIddict (OAuth infrastructure - no frontend)
          - name: Umbraco.Automate.OpenIddict
            changeVar: OpeniddictChanged
            hasNpm: false
    - name: level2Products
      type: object
      default:
          # Slack (depends on OpenIddict - no frontend)
          - name: Umbraco.Automate.Slack
            changeVar: SlackChanged
            hasNpm: false

    # Queue-time override: generate SBOMs and run the license policy check on any branch.
    # SBOMs normally only run on vN/release/* and vN/hotfix/*, where they are also uploaded to
    # Dependency-Track. Elsewhere this covers every product and never uploads, so in-progress
    # versions don't land in Dependency-Track.
    - name: generateSbom
      displayName: Generate SBOMs and check licenses (no upload off release/hotfix)
      type: boolean
      default: false

# Feature branches are not listed: their pull request builds them, and a branch
# trigger as well would build every push twice.
# batch: a burst of merges builds once, from the latest commit, rather than once per merge.
trigger:
    batch: true
    branches:
        include:
            - v*/main
            - v*/dev
            - v*/release/*
            - v*/hotfix/*

pr:
    branches:
        include:
            - v*/main
            - v*/dev

variables:
    - group: dependency-track
    - name: NODE_VERSION
      value: "24.x"
    - name: DOTNET_NOLOGO
      value: "true"
    - name: DOTNET_CLI_TELEMETRY_OPTOUT
      value: "true"
    # A push to vN/main, vN/dev, vN/release/* or vN/hotfix/*: the builds that publish packages.
    # Resolves to "True" or "False" at compile time; eq() compares case-insensitively.
    - name: isPublishBuild
      value: ${{ and(ne(variables['Build.Reason'], 'PullRequest'), or(contains(variables['Build.SourceBranch'], '/release/'), contains(variables['Build.SourceBranch'], '/hotfix/'), endsWith(variables['Build.SourceBranch'], '/main'), endsWith(variables['Build.SourceBranch'], '/dev'))) }}

stages:
    # ============================================================
    # Build & Test everything
    # ============================================================
    - stage: Build
      displayName: Build & Test
      jobs:
          - job: BuildAndTest
            displayName: Build & Test
            pool:
                vmImage: "ubuntu-latest"
            variables:
                NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
                npm_config_cache: $(Pipeline.Workspace)/.npm
            steps:
                - checkout: self
                  fetchDepth: 0

                # Set here rather than in a stage of its own, which cost an extra agent and
                # its wait on every build. Safe to set early: every version.json disables
                # nbgv's cloud build number, so the Pack stage's `nbgv cloud` leaves it alone.
                - task: Bash@3
                  displayName: Set build number (branch + date)
                  inputs:
                      targetType: inline
                      script: |
                          BUILD_DATE=$(date -u +%Y%m%d)
                          echo "##vso[build.updatebuildnumber]$(Build.SourceBranchName)-${BUILD_DATE}-$(Build.BuildID)"

                # Change detection runs here rather than as the first job of the Pack stage,
                # which cost an agent and its wait before any packing could start. It only
                # reads git history, so it runs before the build touches the working tree.
                # The Pack stage reads its outputs via stageDependencies.
                - task: PowerShell@2
                  displayName: Run change detection
                  name: detect
                  condition: and(succeeded(), eq(variables.isPublishBuild, 'True'))
                  inputs:
                      filePath: .azure-pipelines/scripts/detect-changes.ps1
                      pwsh: true
                  env:
                      # Required by Get-LastSuccessfulBuildCommit to query the Azure DevOps REST API
                      # for the previous successful build's source version on this branch.
                      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

                - task: Bash@3
                  displayName: Summarize packed products + tag build
                  condition: and(succeeded(), eq(variables.isPublishBuild, 'True'))
                  inputs:
                      targetType: inline
                      script: |
                          PRODUCTS="$(detect.AllChangedProducts)"
                          ANY="$(detect.AnyChanged)"
                          MAX_LEVEL="$(detect.MaxLevel)"

                          if [ -z "$PRODUCTS" ]; then
                            PRODUCTS="(none)"
                          fi

                          SUMMARY_FILE="$(Build.ArtifactStagingDirectory)/pack-summary.md"
                          {
                            echo "## Pack Summary"
                            echo ""
                            echo "- AnyChanged: ${ANY:-false}"
                            echo "- MaxLevel: ${MAX_LEVEL:-0}"
                            echo "- CoreChanged: $(detect.CoreChanged)"
                            echo "- Products: ${PRODUCTS}"
                            echo ""
                            echo "Artifacts (if produced):"
                            echo "- all-nuget-packages"
                            echo "- all-npm-packages"
                          } > "$SUMMARY_FILE"

                          echo "##vso[task.uploadsummary]$SUMMARY_FILE"

                          if [ "$PRODUCTS" = "(none)" ]; then
                            echo "##vso[build.addbuildtag]pack-none"
                            exit 0
                          fi

                          if [ "$(detect.CoreChanged)" = "true" ]; then
                            echo "##vso[build.addbuildtag]pack-core"
                          fi

                          IFS=',' read -ra ITEMS <<< "$PRODUCTS"
                          for item in "${ITEMS[@]}"; do
                            trimmed="$(echo "$item" | xargs)"
                            if [ -n "$trimmed" ]; then
                              name="$trimmed"
                              if [[ "$name" == Umbraco.Automate.* ]]; then
                                name="${name#Umbraco.Automate.}"
                              elif [[ "$name" == Umbraco.Automate ]]; then
                                name="core"
                              fi
                              safe="$(echo "$name" | tr '[:upper:]' '[:lower:]' | tr '.' '-' | tr -cd 'a-z0-9-')"
                              echo "##vso[build.addbuildtag]pack-$safe"
                            fi
                          done

                - task: UseDotNet@2
                  displayName: Setup .NET
                  inputs:
                      useGlobalJson: true

                - task: UseNode@1
                  displayName: Setup Node.js
                  inputs:
                      version: $(NODE_VERSION)

                # PR builds read the cache saved by their target branch's builds.
                - task: Cache@2
                  displayName: Cache npm
                  inputs:
                      key: 'npm | "$(Agent.OS)" | package-lock.json'
                      restoreKeys: |
                          npm | "$(Agent.OS)"
                      path: $(npm_config_cache)

                # No packages.lock.json in this repo. Central package management puts every
                # version in Directory.Packages.props, so key on that alone: keying on project
                # files too would miss, and pay the cache save, on every PR that edits a .csproj.
                - task: Cache@2
                  displayName: Cache NuGet packages
                  inputs:
                      key: 'nuget | "$(Agent.OS)" | Directory.Packages.props'
                      restoreKeys: |
                          nuget | "$(Agent.OS)"
                      path: $(NUGET_PACKAGES)

                - script: |
                      npm ci --include=optional
                      npm run build
                  displayName: Build frontend

                - script: dotnet restore Umbraco.Automate.slnx
                  displayName: Restore

                - script: dotnet build Umbraco.Automate.slnx --configuration Release --no-restore -p:DisableCloudBuildNumber=true
                  displayName: Build

                - script: dotnet test Umbraco.Automate.slnx --configuration Release --no-build --verbosity normal --logger trx --results-directory $(Agent.TempDirectory)/TestResults
                  displayName: Test

                - task: PublishTestResults@2
                  displayName: Publish test results
                  condition: always()
                  inputs:
                      testResultsFormat: VSTest
                      testResultsFiles: "$(Agent.TempDirectory)/TestResults/**/*.trx"
                      mergeTestResults: true

                # .artifactignore at the repo root keeps .git and node_modules out of this
                # artifact: the Pack jobs check out the repo themselves and don't need them.
                - task: PublishPipelineArtifact@1
                  displayName: Upload build outputs
                  inputs:
                      targetPath: $(Build.SourcesDirectory)
                      artifact: build-outputs
                      publishLocation: pipeline

    # ============================================================
    # Acceptance Tests - Playwright end-to-end against a real running site
    #
    # Depends on nothing, so it runs alongside Build and gates pull requests too.
    # It uses nothing Build produces (it builds the site from source itself), so
    # waiting for Build only added ~3.5 min of wall-clock. Pack is not an option:
    # it is restricted to pushes on vN/main, vN/dev, vN/hotfix/*, vN/release/*.
    # The site is scaffolded from source by scripts/install-demo-site.ps1, the
    # same script developers run, so the leg exercises project references
    # rather than a published package and matches the local workflow exactly.
    #
    # Windows + SQL Server LocalDB, not Linux + SQLite, matching Forms and the CMS
    # acceptance legs. The CMS SQLite connection string carries Cache=Shared, and
    # with a shared cache the CMS cache-instruction sync job and an end-of-request
    # cache-instruction insert can deadlock on umbracoCacheInstruction. The pending
    # write then blocks every connection in the process (SQLite Error 6 'database
    # table is locked' on unrelated Automate and OpenIddict tables), and the CMS
    # retry policy retries it 10x at the 30s command timeout, so the site stalls for
    # ~9.5 min and every spec in that window fails in fixture setup (build 289321).
    # SQL Server has no shared cache and no single-writer lock, so the stall cannot
    # happen here. It also runs Automate's SQL Server migrations end to end.
    # Local development stays on SQLite, where the stall is rare.
    # ============================================================
    - stage: AcceptanceTests
      displayName: Acceptance Tests
      dependsOn: []
      jobs:
          # Decides whether a pull request needs the acceptance suite at all, and how much of it.
          # A job in this stage rather than a step in Build (as in Forms), because this stage
          # deliberately runs alongside Build: waiting on Build would put the whole .NET build
          # and test run back on the acceptance critical path. It needs only the PR merge commit
          # and its two parents, so a depth-2 checkout on a Linux agent is enough.
          - job: Changes
            displayName: Detect acceptance changes
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self
                  fetchDepth: 2

                # A PR build sorts its changed files (the PR merge commit against its first
                # parent, the target branch tip) into areas, first match wins:
                #   none         *.md, docs/, .claude/, .github/, .githooks/, assets/, templates/
                #                (the dotnet new templates, not scripts/templates/), LICENSE and
                #                repo tooling (commitlint, prettier, .mcp.json, changelog and
                #                release-manifest scripts and config, git-hook setup,
                #                marketplace JSON)                -> no acceptance
                #   tests        the .NET unit, integration and common test projects
                #                                                 -> no acceptance (Build runs them)
                #   specs        tests/...AcceptanceTests/ tests/, lib/ and umbraco.config.ts
                #                                                 -> acceptance, CHANGED SPECS only
                #   acceptance   the rest of tests/...AcceptanceTests/ (package*.json,
                #                playwright.config.ts, tsconfig.json, postinstall.js, ...)
                #                                                 -> acceptance, whole suite
                #   shared       anything else: product code, the frontend, the demo-site
                #                scripts and templates, pipeline YAML, Directory.*.props,
                #                global.json, version.json, NuGet config, ...
                #                                                 -> acceptance, whole suite
                # A PR touching only none/tests files skips the suite. Pushes, and anything
                # unexpected (not a PR merge commit, empty diff), run the whole suite. The
                # acceptance job's condition skips only on an explicit 'false', so a missing
                # variable runs the suite rather than silently skipping it.
                #
                # acceptanceChangedOnly is true only when acceptance runs because of `specs` files
                # and nothing else. The matrix step then picks one leg running Playwright's
                # --only-changed, which runs the changed spec files plus any spec that imports a
                # changed file. That import graph is why `specs` is limited to TypeScript the specs
                # import: package.json, the Playwright config or the npm install scripts are not
                # imported by any spec (playwright.config.ts only by auth.setup.ts), so
                # --only-changed would run next to nothing for them, and they run the whole suite.
                - bash: |
                      runAcceptance=true
                      acceptanceChangedOnly=false
                      acc=Umbraco.Automate/tests/Umbraco.Automate.Tests.AcceptanceTests
                      if [ "$(Build.Reason)" = "PullRequest" ] && git rev-parse -q --verify HEAD^2 >/dev/null; then
                        # --no-renames lists a moved file's old path too, so moving code out of src/
                        # into docs/ can't hide the src/ side and skip the suite.
                        changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
                        if [ -n "$changed" ]; then
                          runAcceptance=false
                          # Set by any area that needs the whole suite, not just changed specs.
                          fullAcceptance=false
                          while IFS= read -r file; do
                            case "$file" in
                              *.md|docs/*|.claude/*|.github/*|.githooks/*|assets/*|templates/*|LICENSE|commitlint.config.js|.git-blame-ignore-revs|.prettierrc|.prettierignore|.mcp.json|.worktreeinclude|*/changelog.config.json|*/umbraco-marketplace*.json|scripts/generate-changelog*|scripts/generate-release-manifest*|scripts/list-commit-options.js|scripts/setup-git-hooks*|.azure-pipelines/scripts/validate-changelogs.ps1)
                                area=none ;;
                              Umbraco.Automate/tests/Umbraco.Automate.Tests.Unit/*|Umbraco.Automate/tests/Umbraco.Automate.Tests.Integration/*|Umbraco.Automate/tests/Umbraco.Automate.Tests.Common/*|Umbraco.Automate/tests/Directory.*|Umbraco.Automate.OpenIddict/tests/*|Umbraco.Automate.Slack/tests/*)
                                area=tests ;;
                              "$acc"/tests/*|"$acc"/lib/*|"$acc"/umbraco.config.ts)
                                area=specs ;;
                              "$acc"/*)
                                area=acceptance ;;
                              *)
                                area=shared ;;
                            esac
                            echo "$area: $file"
                            case "$area" in
                              specs) runAcceptance=true ;;
                              acceptance|shared) runAcceptance=true; fullAcceptance=true ;;
                            esac
                          done <<< "$changed"
                          if [ "$runAcceptance" = true ] && [ "$fullAcceptance" = false ]; then
                            acceptanceChangedOnly=true
                          fi
                        fi
                      else
                        echo "Not a PR merge commit: running the whole acceptance suite."
                      fi
                      echo "Acceptance tests: $runAcceptance (changed specs only: $acceptanceChangedOnly)"
                      echo "##vso[task.setvariable variable=runAcceptance;isOutput=true]$runAcceptance"
                      echo "##vso[task.setvariable variable=acceptanceChangedOnly;isOutput=true]$acceptanceChangedOnly"
                  name: changes
                  displayName: Detect whether acceptance tests run

                # STANDARD: four shards of the whole suite. CHANGED (a PR whose only
                # acceptance-relevant changes are specs - see acceptanceChangedOnly above): ONE
                # unsharded leg running --only-changed against the PR's target branch tip. A
                # handful of specs don't need four agents each paying the build, scaffold and
                # LocalDB first boot. HEAD~1 rather than HEAD^1, because npm runs the script through
                # cmd.exe on Windows, where ^ is the escape character; on the PR merge commit both
                # name the same first parent, which the acceptance job's full-history checkout has.
                # --pass-with-no-tests keeps a PR that only deletes specs green.
                #
                # Each leg carries its own testCommand (incl. any --shard) and a `leg` name for
                # step titles and artifact names; the run step just executes testCommand. There
                # is no release-type matrix or force-full parameter here: every non-PR build
                # leaves acceptanceChangedOnly false and gets STANDARD.
                - bash: |
                      STANDARD='{"Shard 1 of 4":{"leg":"Shard 1 of 4","testCommand":"npm run test -- --shard=1/4"},"Shard 2 of 4":{"leg":"Shard 2 of 4","testCommand":"npm run test -- --shard=2/4"},"Shard 3 of 4":{"leg":"Shard 3 of 4","testCommand":"npm run test -- --shard=3/4"},"Shard 4 of 4":{"leg":"Shard 4 of 4","testCommand":"npm run test -- --shard=4/4"}}'
                      CHANGED='{"Changed specs":{"leg":"Changed specs","testCommand":"npm run test -- --only-changed=HEAD~1 --pass-with-no-tests"}}'
                      matrix="$STANDARD"
                      if [ "$(changes.acceptanceChangedOnly)" = "true" ]; then matrix="$CHANGED"; fi
                      echo "Acceptance matrix: $matrix"
                      echo "##vso[task.setvariable variable=acceptanceMatrix;isOutput=true]$matrix"
                  name: acceptance
                  displayName: Compute acceptance matrix

          - job: AcceptanceTests
            displayName: Run Playwright Acceptance Tests
            dependsOn: Changes
            condition: and(succeeded(), ne(dependencies.Changes.outputs['changes.runAcceptance'], 'false'))
            # Computed by the Changes job: four shards of the whole suite, or one leg running
            # just the changed specs. Each shard gets its own demo site and LocalDB. The
            # specs share site data and the suite runs one worker, so shards cannot share a
            # site; splitting across agents is what makes them run concurrently. Playwright
            # splits by test (fullyParallel in playwright.config.ts, --shard in each leg's
            # testCommand), and every leg runs auth.setup.ts itself. maxParallel is left at the
            # default so all shards run concurrently.
            strategy:
                matrix: $[ dependencies.Changes.outputs['acceptance.acceptanceMatrix'] ]
            # Windows agents build more slowly, and the first boot against a cold LocalDB
            # creates the database and runs the full unattended install.
            timeoutInMinutes: 60
            pool:
                vmImage: "windows-latest"
            variables:
                # Makes playwright.config.ts pick its CI profile (junit reporter,
                # retries, longer timeouts) and makes postinstall.js skip the
                # interactive config prompt.
                CI: "true"
                ASPNETCORE_ENVIRONMENT: Development
                ASPNETCORE_URLS: https://localhost:44380
                PLAYWRIGHT_BROWSERS_PATH: $(Pipeline.Workspace)/ms-playwright
                # Cached below. Each shard otherwise restored NuGet cold three times (~1:20) and ran
                # two cold `npm ci` (~1:50), a large share of its ~7:30 of setup (build 289743).
                NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
                npm_config_cache: $(Pipeline.Workspace)/.npm
                acceptanceDir: $(Build.SourcesDirectory)/Umbraco.Automate/tests/Umbraco.Automate.Tests.AcceptanceTests
                # Override the scaffold's SQLite connection string. Automate shares it
                # (Umbraco:Automate:UseNamedConnectionString = umbracoDbDSN), so this moves
                # both the CMS and Automate onto LocalDB. InstallMissingDatabase lets the
                # unattended install create the database file on first boot.
                CONNECTIONSTRINGS__UMBRACODBDSN: Data Source=(localdb)\MSSQLLocalDB;AttachDbFilename=|DataDirectory|\Umbraco.mdf;Integrated Security=True
                CONNECTIONSTRINGS__UMBRACODBDSN_PROVIDERNAME: Microsoft.Data.SqlClient
                UMBRACO__CMS__GLOBAL__INSTALLMISSINGDATABASE: true
            steps:
                # Full history, like the Build stage: the demo site builds the products from
                # project references, and Nerdbank.GitVersioning cannot compute a version
                # height from a shallow clone. It also gives a changed-specs leg the merge
                # commit's first parent that --only-changed=HEAD~1 diffs against.
                - checkout: self
                  fetchDepth: 0

                # Started now and left running, so its 10-30s boot overlaps the builds instead of
                # sitting on the critical path. "Wait for SQL Server LocalDB" below checks it is up.
                - pwsh: |
                      Start-Process SqlLocalDB -ArgumentList 'start', 'MSSQLLocalDB' -WindowStyle Hidden
                      Write-Host "SQL Server LocalDB starting in the background"
                  displayName: Start SQL Server LocalDB (background)

                # The SDK global.json pins is not on the hosted image, so UseDotNet downloaded and
                # extracted it on every shard (24-59s). UseDotNet finds a cached copy in its tool
                # directory and skips the download.
                - task: Cache@2
                  displayName: Cache .NET SDK
                  inputs:
                      key: 'dotnet-sdk | "$(Agent.OS)" | global.json'
                      path: $(Agent.ToolsDirectory)/dotnet

                - task: UseDotNet@2
                  displayName: Setup .NET
                  inputs:
                      useGlobalJson: true

                - task: UseNode@1
                  displayName: Setup Node.js
                  inputs:
                      version: $(NODE_VERSION)

                # One npm cache for both installs: the frontend at the repo root and the acceptance
                # test packages. The Build stage's npm and NuGet caches are keyed on its Linux agent,
                # so these Windows jobs keep their own. PR builds read what their target branch saved.
                - task: Cache@2
                  displayName: Cache npm
                  inputs:
                      key: 'npm | "$(Agent.OS)" | package-lock.json | Umbraco.Automate/tests/Umbraco.Automate.Tests.AcceptanceTests/package-lock.json'
                      restoreKeys: |
                          npm | "$(Agent.OS)"
                      path: $(npm_config_cache)

                # Versions live in Directory.Packages.props; the demo site's own packages (the
                # Umbraco template, Clean, WorktreeDevPort) come from install-demo-site.ps1.
                - task: Cache@2
                  displayName: Cache NuGet packages
                  inputs:
                      key: 'nuget | "$(Agent.OS)" | Directory.Packages.props | scripts/install-demo-site.ps1'
                      restoreKeys: |
                          nuget | "$(Agent.OS)"
                      path: $(NUGET_PACKAGES)

                # Builds the wwwroot bundles the demo site serves. Without this the
                # Automate section silently fails to register and every UI spec fails
                # with element-not-found, which looks like a product bug but is not.
                # bash, not script: on Windows `script` is cmd, where the first npm (a
                # .cmd batch file) would end the step before the build ran.
                - bash: |
                      set -e
                      npm ci --include=optional
                      npm run build
                  displayName: Build frontend

                # -SkipSolution: CI builds the demo project directly and never opens the local .slnx.
                - pwsh: ./scripts/install-demo-site.ps1 -SkipSolution
                  displayName: Scaffold demo site

                # The demo lives under demos/vN where N comes from Umbraco.Cms.Core in
                # Directory.Packages.props, so resolve it rather than hard-coding a major.
                - pwsh: |
                      $demoProject = Get-ChildItem -Path demos -Recurse -Filter Umbraco.Automate.DemoSite.csproj | Select-Object -First 1
                      if (-not $demoProject) {
                        Write-Host "##vso[task.logissue type=error]Demo site project not found under demos/"
                        exit 1
                      }
                      Write-Host "Demo project: $($demoProject.FullName)"
                      Write-Host "##vso[task.setvariable variable=demoProject]$($demoProject.FullName)"
                  displayName: Resolve demo site path

                - script: dotnet dev-certs https
                  displayName: Create HTTPS development certificate

                - script: dotnet build "$(demoProject)" --configuration Release
                  displayName: Build demo site

                # Started in the background at the top of the job; by now it has usually been up for
                # minutes, so this normally returns at once. Falls back to a blocking start if the
                # background start did not take.
                - pwsh: |
                      for ($i = 0; $i -lt 60; $i++) {
                        if ((SqlLocalDB info MSSQLLocalDB) -match 'State:\s+Running') {
                          Write-Host "SQL Server LocalDB is running (check $i)"
                          exit 0
                        }
                        Start-Sleep -Seconds 1
                      }
                      Write-Host "LocalDB not running after 60s; starting it in the foreground"
                      SqlLocalDB start MSSQLLocalDB
                  displayName: Wait for SQL Server LocalDB

                # Keyed on the acceptance package-lock, which pins the Playwright
                # version that determines the required browser build.
                - task: Cache@2
                  displayName: Cache Playwright browsers
                  inputs:
                      key: 'playwright | "$(Agent.OS)" | $(acceptanceDir)/package-lock.json'
                      restoreKeys: |
                          playwright | "$(Agent.OS)"
                      path: $(PLAYWRIGHT_BROWSERS_PATH)

                - script: npm ci --no-fund --no-audit
                  displayName: Restore acceptance test packages
                  workingDirectory: $(acceptanceDir)

                # script (cmd), not pwsh: under pwsh the install hangs after the download
                # reaches 100% (seen in Forms). No --with-deps, which only installs Linux
                # packages. On a cache hit the download is skipped.
                - script: npx playwright install chromium
                  displayName: Install Playwright Chromium
                  workingDirectory: $(acceptanceDir)
                  timeoutInMinutes: 15
                  retryCountOnTaskFailure: 2

                # config.js is interactive and reads the per-worktree port from git
                # config, which is a local-development affordance. In CI the URL is fixed by
                # ASPNETCORE_URLS, and the credentials are the ones the scaffold
                # installs unattended, so write .env directly.
                #
                # STORAGE_STATE_PATH is not optional. The CMS umbracoApi fixture refreshes the
                # login before every test and, only when this is set, saves the browser state
                # (with the rotated refresh token) afterwards. Without it every test starts from
                # the token auth.setup.ts saved, which the first refresh already used up, so each
                # test fell back to a full re-login (24 in build 289321). Same file as
                # playwright.config.ts's storageState, as in Forms' pipeline.
                - pwsh: |
                      "UMBRACO_USER_LOGIN=admin@example.com",
                      "UMBRACO_USER_PASSWORD=password1234",
                      "URL=$(ASPNETCORE_URLS)",
                      "STORAGE_STATE_PATH=$(acceptanceDir)/playwright/.auth/user.json",
                      "CONSOLE_ERRORS_PATH=$(acceptanceDir)/results/console-errors.json" | Set-Content .env
                      Write-Host "Wrote .env targeting $(ASPNETCORE_URLS)"
                  displayName: Generate .env
                  workingDirectory: $(acceptanceDir)

                - pwsh: |
                      $process = Start-Process dotnet "run --project `"$(demoProject)`" --configuration Release --no-build --no-launch-profile" -PassThru -NoNewWindow -RedirectStandardOutput "$(Build.ArtifactStagingDirectory)/demo-site.log" -RedirectStandardError "$(Build.ArtifactStagingDirectory)/demo-site.err.log"
                      Write-Host "##vso[task.setvariable variable=demoSitePid]$($process.Id)"
                      Write-Host "Demo site starting as PID $($process.Id)"
                  displayName: Start demo site

                # First boot creates the LocalDB database and runs the unattended install and
                # the Automate schema migrations, so allow generous time before calling it a failure.
                # Polls every 3s (was 10s): the site is usually up in 20-35s, so a coarse poll
                # added up to 10s of idle wait per shard.
                - pwsh: |
                      for ($i = 0; $i -lt 300; $i++) {
                        try {
                          Invoke-WebRequest "$(ASPNETCORE_URLS)/umbraco" -SkipCertificateCheck -UseBasicParsing -TimeoutSec 10 | Out-Null
                          Write-Host "Demo site is up (attempt $i)"
                          exit 0
                        } catch {
                          Start-Sleep -Seconds 3
                        }
                      }
                      Write-Host "##vso[task.logissue type=error]Demo site did not respond within 15 minutes"
                      Get-Content "$(Build.ArtifactStagingDirectory)/demo-site.log" -Tail 100 -ErrorAction SilentlyContinue
                      Get-Content "$(Build.ArtifactStagingDirectory)/demo-site.err.log" -Tail 100 -ErrorAction SilentlyContinue
                      exit 1
                  displayName: Wait for demo site

                - script: $(testCommand)
                  displayName: Run acceptance tests ($(leg))
                  workingDirectory: $(acceptanceDir)

                # always(), so the site is also stopped after a failed or cancelled test step.
                # The recorded PID is the `dotnet run` launcher; the site it starts is a child
                # that holds demo-site.log open, and killing only the launcher would orphan it
                # and fail the log upload below. taskkill /T kills the whole tree.
                - pwsh: |
                      taskkill /PID $(demoSitePid) /T /F
                      exit 0
                  displayName: Stop demo site
                  condition: and(always(), ne(variables.demoSitePid, ''))

                - pwsh: SqlLocalDB stop MSSQLLocalDB
                  displayName: Stop SQL Server LocalDB
                  condition: always()

                - task: PublishTestResults@2
                  displayName: Publish acceptance test results
                  condition: always()
                  inputs:
                      testResultsFormat: JUnit
                      testResultsFiles: "$(acceptanceDir)/results/results.xml"
                      testRunTitle: Acceptance Tests ($(leg))
                      mergeTestResults: true

                # Traces, screenshots and video for every failed test, plus the site
                # logs, because a UI failure is rarely diagnosable from the error alone.
                # always(), as in Forms: a job killed by its timeout is cancelled, and a
                # cancelled job skips steps whose condition does not include always(), so
                # the run that most needs diagnosing would upload nothing. The leg name and attempt
                # number keep shards and re-runs from colliding on the same artifact name.
                - task: PublishPipelineArtifact@1
                  displayName: Upload failure diagnostics
                  condition: always()
                  inputs:
                      targetPath: $(acceptanceDir)/results
                      artifact: acceptance-test-results - $(leg) - Attempt $(System.JobAttempt)
                      publishLocation: pipeline

                - task: PublishPipelineArtifact@1
                  displayName: Upload demo site logs
                  condition: always()
                  inputs:
                      targetPath: $(Build.ArtifactStagingDirectory)
                      artifact: acceptance-demo-site-log - $(leg) - Attempt $(System.JobAttempt)
                      publishLocation: pipeline

    # ============================================================
    # Generate & Upload SBOMs - Only runs on push to vN/release/* and vN/hotfix/*, or on any
    # branch when generateSbom is ticked at queue time (generate + license check, no upload)
    # Covers only the products being released (same change detection as Pack), uploads them to
    # Dependency-Track, and gates Pack: a license policy violation stops the release
    # ============================================================
    - stage: GenerateSBOM
      displayName: Generate & Upload SBOMs
      dependsOn: Build
      condition: |
          and(
            succeeded(),
            ne(variables['Build.Reason'], 'PullRequest'),
            or(
              eq('${{ parameters.generateSbom }}', 'true'),
              contains(variables['Build.SourceBranch'], '/release/'),
              contains(variables['Build.SourceBranch'], '/hotfix/')
            )
          )
      jobs:
          - job: GenerateSBOMs
            displayName: Generate SBOMs
            pool:
                vmImage: "ubuntu-latest"
            ${{ if or(contains(variables['Build.SourceBranch'], '/release/'), contains(variables['Build.SourceBranch'], '/hotfix/')) }}:
                variables:
                    # The products in the release, from the Build job's change detection
                    sbomProducts: $[ stageDependencies.Build.BuildAndTest.outputs['detect.AllChangedProducts'] ]
            steps:
                # nbgv needs full history to work out each product's version
                - checkout: self
                  fetchDepth: 0

                # A queue-time SBOM check on any other branch covers every product, since
                # change detection only narrows the list to a release on release/hotfix.
                - ${{ if and(not(contains(variables['Build.SourceBranch'], '/release/')), not(contains(variables['Build.SourceBranch'], '/hotfix/'))) }}:
                      - pwsh: |
                            $products = (Get-ChildItem -Directory | Where-Object { Test-Path (Join-Path $_.FullName "version.json") }).Name -join ","
                            Write-Host "Products: $products"
                            Write-Host "##vso[task.setvariable variable=sbomProducts]$products"
                        displayName: List all products

                - template: .azure-pipelines/templates/sbom.yml
                  parameters:
                      products: $(sbomProducts)
                      upload: ${{ or(contains(variables['Build.SourceBranch'], '/release/'), contains(variables['Build.SourceBranch'], '/hotfix/')) }}

    # ============================================================
    # Validate Changelogs - Only runs on release and hotfix branches
    # Ensures CHANGELOGs are present and match version.json
    # Runs in parallel with GenerateSBOM after Build
    # ============================================================
    - stage: ValidateChangelogs
      displayName: Validate Changelogs
      dependsOn: Build
      # Only validate on release and hotfix branches (not main or dev)
      condition: |
          and(
            succeeded(),
            ne(variables['Build.Reason'], 'PullRequest'),
            or(
              contains(variables['Build.SourceBranch'], '/release/'),
              contains(variables['Build.SourceBranch'], '/hotfix/')
            )
          )
      jobs:
          - job: ValidateChangelogFiles
            displayName: Validate CHANGELOG.md Files
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self
                  fetchDepth: 0

                - task: PowerShell@2
                  displayName: Validate changelogs
                  inputs:
                      filePath: .azure-pipelines/scripts/validate-changelogs.ps1
                      pwsh: true
                      failOnStderr: false

    # ============================================================
    # Pack Stage - Only runs on push to vN/main, vN/dev, vN/hotfix/*, vN/release/* branches
    # Uses dynamic change detection to only pack products that changed
    # Waits for GenerateSBOM so a license policy violation stops a release before it is packed
    # ============================================================
    - stage: Pack
      displayName: Pack NuGet & NPM Packages
      dependsOn:
          - Build
          - ValidateChangelogs
          - GenerateSBOM
      # Only pack on push (not PR) to vN/main, vN/dev, vN/hotfix/*, vN/release/* branches,
      # and only when change detection (in the Build job) found something to pack.
      # ValidateChangelogs and GenerateSBOM may be skipped (on vN/main, vN/dev branches), which is OK.
      # GenerateSBOM succeeds with issues when only the Dependency-Track upload failed.
      condition: |
          and(
            in(dependencies.Build.result, 'Succeeded'),
            in(dependencies.ValidateChangelogs.result, 'Succeeded', 'Skipped'),
            in(dependencies.GenerateSBOM.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
            eq(variables.isPublishBuild, 'True'),
            eq(dependencies.Build.outputs['BuildAndTest.detect.AnyChanged'], 'true')
          )
      jobs:
          # ============================================================
          # Pack Core (Level 0 - no internal dependencies)
          # Conditional based on change detection
          # ============================================================
          - job: PackCore
            displayName: Pack Umbraco.Automate
            condition: eq(stageDependencies.Build.BuildAndTest.outputs['detect.CoreChanged'], 'true')
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self
                  fetchDepth: 0

                - task: UseDotNet@2
                  displayName: Setup .NET
                  inputs:
                      useGlobalJson: true

                - task: DownloadPipelineArtifact@2
                  displayName: Download build outputs
                  inputs:
                      artifact: build-outputs
                      path: $(Build.SourcesDirectory)

                - template: .azure-pipelines/templates/pack-product.yml
                  parameters:
                      product: Umbraco.Automate
                      # Use project references on vN/dev (preview releases), NuGet packages on vN/release, vN/hotfix, vN/main (validate ranges)
                      useProjectReferences: ${{ endsWith(variables['Build.SourceBranch'], '/dev') }}

                - template: .azure-pipelines/templates/upload-packages.yml
                  parameters:
                      product: Umbraco.Automate

          # ============================================================
          # Pack Level 1 (OpenIddict - depends on Core)
          # Matrix generated from parameters.level1Products
          # ============================================================
          - job: PackLevel1
            displayName: Pack Level 1
            dependsOn:
                - PackCore
            condition: |
                and(
                  not(failed()),
                  not(canceled()),
                  eq(stageDependencies.Build.BuildAndTest.outputs['detect.Level1Changed'], 'true')
                )
            pool:
                vmImage: "ubuntu-latest"
            strategy:
                matrix:
                    # Generated from parameters.level1Products
                    ${{ each product in parameters.level1Products }}:
                        ${{ replace(replace(product.name, 'Umbraco.Automate.', ''), '.', '_') }}:
                            product: ${{ product.name }}
                            changeVar: ${{ product.changeVar }}
                maxParallel: 10
            variables:
                # Pass all per-product change flags as job variables
                CoreChanged: $[ stageDependencies.Build.BuildAndTest.outputs['detect.CoreChanged'] ]
                ${{ each product in parameters.level1Products }}:
                    ${{ product.changeVar }}: $[ stageDependencies.Build.BuildAndTest.outputs['detect.${{ product.changeVar }}'] ]
            steps:
                - checkout: self
                  fetchDepth: 0

                - template: .azure-pipelines/templates/check-should-pack.yml

                - template: .azure-pipelines/templates/setup-pack-job.yml
                  parameters:
                      downloadCore: true
                      downloadLevel1: false

                - template: .azure-pipelines/templates/pack-product.yml
                  parameters:
                      product: $(product)
                      # Use project references on vN/dev (preview releases), NuGet packages on vN/release, vN/hotfix, vN/main (validate ranges)
                      useProjectReferences: ${{ endsWith(variables['Build.SourceBranch'], '/dev') }}
                      condition: eq(variables['check.shouldPack'], 'true')

                - template: .azure-pipelines/templates/upload-packages.yml
                  parameters:
                      product: $(product)
                      condition: eq(variables['check.shouldPack'], 'true')

          # ============================================================
          # Pack Level 2 (Slack - depends on OpenIddict)
          # Matrix generated from parameters.level2Products
          # ============================================================
          - job: PackLevel2
            displayName: Pack Level 2
            dependsOn:
                - PackCore
                - PackLevel1
            condition: |
                and(
                  not(failed()),
                  not(canceled()),
                  eq(stageDependencies.Build.BuildAndTest.outputs['detect.Level2Changed'], 'true')
                )
            pool:
                vmImage: "ubuntu-latest"
            strategy:
                matrix:
                    # Generated from parameters.level2Products
                    ${{ each product in parameters.level2Products }}:
                        ${{ replace(replace(product.name, 'Umbraco.Automate.', ''), '.', '_') }}:
                            product: ${{ product.name }}
                            changeVar: ${{ product.changeVar }}
                maxParallel: 10
            variables:
                # Pass all per-product change flags as job variables
                CoreChanged: $[ stageDependencies.Build.BuildAndTest.outputs['detect.CoreChanged'] ]
                ${{ each product in parameters.level1Products }}:
                    ${{ product.changeVar }}: $[ stageDependencies.Build.BuildAndTest.outputs['detect.${{ product.changeVar }}'] ]
                ${{ each product in parameters.level2Products }}:
                    ${{ product.changeVar }}: $[ stageDependencies.Build.BuildAndTest.outputs['detect.${{ product.changeVar }}'] ]
            steps:
                - checkout: self
                  fetchDepth: 0

                - template: .azure-pipelines/templates/check-should-pack.yml

                - template: .azure-pipelines/templates/setup-pack-job.yml
                  parameters:
                      downloadCore: true
                      downloadLevel1: true
                      level1Products: ${{ parameters.level1Products }}

                - template: .azure-pipelines/templates/pack-product.yml
                  parameters:
                      product: $(product)
                      # Use project references on vN/dev (preview releases), NuGet packages on vN/release, vN/hotfix, vN/main (validate ranges)
                      useProjectReferences: ${{ endsWith(variables['Build.SourceBranch'], '/dev') }}
                      condition: eq(variables['check.shouldPack'], 'true')

                - template: .azure-pipelines/templates/upload-packages.yml
                  parameters:
                      product: $(product)
                      condition: eq(variables['check.shouldPack'], 'true')

          # ============================================================
          # Collect all packages into single artifact
          # Downloads artifacts from all pack jobs
          # ============================================================
          - job: CollectPackages
            displayName: Collect All Packages
            dependsOn:
                - PackCore
                - PackLevel1
                - PackLevel2
            condition: |
                and(
                  not(failed()),
                  not(canceled()),
                  eq(stageDependencies.Build.BuildAndTest.outputs['detect.AnyChanged'], 'true')
                )
            pool:
                vmImage: "ubuntu-latest"
            variables:
                # Map dependency outputs to job variables (dependencies context only works at job level)
                CoreChanged: $[ stageDependencies.Build.BuildAndTest.outputs['detect.CoreChanged'] ]
                ${{ each product in parameters.level1Products }}:
                    ${{ product.changeVar }}: $[ stageDependencies.Build.BuildAndTest.outputs['detect.${{ product.changeVar }}'] ]
                ${{ each product in parameters.level2Products }}:
                    ${{ product.changeVar }}: $[ stageDependencies.Build.BuildAndTest.outputs['detect.${{ product.changeVar }}'] ]
            steps:
                - checkout: self
                  fetchDepth: 0

                # Download Core NuGet packages (only if Core changed)
                - task: DownloadPipelineArtifact@2
                  displayName: Download Umbraco.Automate NuGet packages
                  condition: eq(variables.CoreChanged, 'true')
                  inputs:
                      artifact: "Umbraco.Automate-packages"
                      targetPath: "$(Pipeline.Workspace)/nuget"

                # Download Level 1 NuGet packages (only if product changed)
                - ${{ each product in parameters.level1Products }}:
                      - task: DownloadPipelineArtifact@2
                        displayName: Download ${{ product.name }} NuGet packages
                        condition: eq(variables.${{ product.changeVar }}, 'true')
                        inputs:
                            artifact: "${{ product.name }}-packages"
                            targetPath: "$(Pipeline.Workspace)/nuget"

                # Download Level 1 npm packages (only for products that have npm packages)
                - ${{ each product in parameters.level1Products }}:
                      - ${{ if eq(product.hasNpm, true) }}:
                            - task: DownloadPipelineArtifact@2
                              displayName: Download ${{ product.name }} npm packages
                              condition: eq(variables.${{ product.changeVar }}, 'true')
                              inputs:
                                  artifact: "${{ product.name }}-npm-packages"
                                  targetPath: "$(Pipeline.Workspace)/npm"

                # Download Level 2 NuGet packages (only if product changed)
                - ${{ each product in parameters.level2Products }}:
                      - task: DownloadPipelineArtifact@2
                        displayName: Download ${{ product.name }} NuGet packages
                        condition: eq(variables.${{ product.changeVar }}, 'true')
                        inputs:
                            artifact: "${{ product.name }}-packages"
                            targetPath: "$(Pipeline.Workspace)/nuget"

                # Download Level 2 npm packages (only for products that have npm packages)
                - ${{ each product in parameters.level2Products }}:
                      - ${{ if eq(product.hasNpm, true) }}:
                            - task: DownloadPipelineArtifact@2
                              displayName: Download ${{ product.name }} npm packages
                              condition: eq(variables.${{ product.changeVar }}, 'true')
                              inputs:
                                  artifact: "${{ product.name }}-npm-packages"
                                  targetPath: "$(Pipeline.Workspace)/npm"

                - task: PowerShell@2
                  displayName: Build pack manifest (projects -> version)
                  name: buildManifest
                  inputs:
                      targetType: inline
                      pwsh: true
                      script: |
                          $manifestDir = Join-Path $env:BUILD_SOURCESDIRECTORY "artifacts"
                          $manifestFile = Join-Path $manifestDir "pack-manifest.json"
                          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null

                          $entries = New-Object System.Collections.Generic.List[object]
                          $packages = @()
                          $nugetRoot = Join-Path $env:PIPELINE_WORKSPACE "nuget"

                          if (Test-Path $nugetRoot) {
                            Add-Type -AssemblyName System.IO.Compression.FileSystem
                            $files = Get-ChildItem -Path $nugetRoot -Recurse -Filter "*.nupkg" -File
                            foreach ($f in $files) {
                              $zip = [System.IO.Compression.ZipFile]::OpenRead($f.FullName)
                              try {
                                $nuspecEntry = $zip.Entries | Where-Object { $_.FullName -like "*.nuspec" } | Select-Object -First 1
                                if ($null -ne $nuspecEntry) {
                                  $reader = New-Object System.IO.StreamReader($nuspecEntry.Open())
                                  try {
                                    $xml = [xml]$reader.ReadToEnd()
                                  } finally {
                                    $reader.Close()
                                  }
                                  $id = $xml.package.metadata.id
                                  $version = $xml.package.metadata.version
                                  if ($id -and $version) {
                                    $packages += [pscustomobject]@{ id = $id; version = $version }
                                  }
                                }
                              } finally {
                                $zip.Dispose()
                              }
                            }
                          }

                          function Add-VersionByProduct {
                            param([string]$Product)
                            $match = $packages | Where-Object { $_.id -eq $Product } | Select-Object -First 1
                            if (-not $match) {
                              $match = $packages | Where-Object { $_.id -like "$Product.*" } | Select-Object -First 1
                            }
                            if ($match) {
                              $entries.Add([pscustomobject]@{ name = $Product; version = $match.version })
                            }
                          }

                          if ("$(CoreChanged)" -eq "true") {
                            Add-VersionByProduct "Umbraco.Automate"
                          }

                          $level1 = $env:LEVEL1_JSON | ConvertFrom-Json
                          foreach ($p in $level1) {
                            $changeVar = [string]$p.changeVar
                            $changed = [Environment]::GetEnvironmentVariable($changeVar)
                            if (-not $changed) {
                              $changed = [Environment]::GetEnvironmentVariable($changeVar.ToUpper())
                            }
                            if ($changed -eq "true") {
                              Add-VersionByProduct $p.name
                            }
                          }

                          $level2 = $env:LEVEL2_JSON | ConvertFrom-Json
                          foreach ($p in $level2) {
                            $changeVar = [string]$p.changeVar
                            $changed = [Environment]::GetEnvironmentVariable($changeVar)
                            if (-not $changed) {
                              $changed = [Environment]::GetEnvironmentVariable($changeVar.ToUpper())
                            }
                            if ($changed -eq "true") {
                              Add-VersionByProduct $p.name
                            }
                          }

                          $json = $entries | ConvertTo-Json -Depth 3
                          $json | Out-File -FilePath $manifestFile -Encoding utf8
                          Write-Host "Pack manifest written to $manifestFile"
                          Write-Host $json
                  env:
                      LEVEL1_JSON: ${{ convertToJson(parameters.level1Products) }}
                      LEVEL2_JSON: ${{ convertToJson(parameters.level2Products) }}

                - task: PublishPipelineArtifact@1
                  displayName: Upload pack manifest
                  inputs:
                      targetPath: $(Build.SourcesDirectory)/artifacts/pack-manifest.json
                      artifact: pack-manifest
                      publishLocation: pipeline

                # Flatten and collect NuGet packages
                - task: Bash@3
                  displayName: Collect NuGet packages
                  name: collectNuget
                  inputs:
                      targetType: inline
                      script: |
                          mkdir -p all-nuget-packages

                          # Find all .nupkg and .snupkg files and move to single directory (only if source dir exists)
                          if [ -d "$(Pipeline.Workspace)/nuget" ]; then
                            find "$(Pipeline.Workspace)/nuget" -name "*.nupkg" -exec mv {} all-nuget-packages/ \; 2>/dev/null || true
                            find "$(Pipeline.Workspace)/nuget" -name "*.snupkg" -exec mv {} all-nuget-packages/ \; 2>/dev/null || true
                          fi

                          # Check if any packages were collected
                          if [ -d "all-nuget-packages" ] && [ "$(ls -A all-nuget-packages 2>/dev/null)" ]; then
                            echo "##vso[task.setvariable variable=hasNugetPackages;isOutput=true]true"
                            echo "Collected NuGet packages:"
                            ls -la all-nuget-packages/
                          else
                            echo "##vso[task.setvariable variable=hasNugetPackages;isOutput=true]false"
                            echo "No NuGet packages collected"
                          fi

                # Flatten and collect npm packages
                - task: Bash@3
                  displayName: Collect npm packages
                  name: collectNpm
                  inputs:
                      targetType: inline
                      script: |
                          mkdir -p all-npm-packages

                          # Find all .tgz files and move to single directory (only if source dir exists)
                          if [ -d "$(Pipeline.Workspace)/npm" ]; then
                            find "$(Pipeline.Workspace)/npm" -name "*.tgz" -exec mv {} all-npm-packages/ \; 2>/dev/null || true
                          fi

                          # Check if any packages were collected
                          if [ -d "all-npm-packages" ] && [ "$(ls -A all-npm-packages 2>/dev/null)" ]; then
                            echo "##vso[task.setvariable variable=hasNpmPackages;isOutput=true]true"
                            echo "Collected npm packages:"
                            ls -la all-npm-packages/
                          else
                            echo "##vso[task.setvariable variable=hasNpmPackages;isOutput=true]false"
                            echo "No npm packages collected"
                          fi

                - task: PublishPipelineArtifact@1
                  displayName: Upload combined NuGet artifact
                  condition: eq(variables['collectNuget.hasNugetPackages'], 'true')
                  inputs:
                      targetPath: $(Build.SourcesDirectory)/all-nuget-packages
                      artifact: all-nuget-packages
                      publishLocation: pipeline

                - task: PublishPipelineArtifact@1
                  displayName: Upload combined npm artifact
                  condition: eq(variables['collectNpm.hasNpmPackages'], 'true')
                  inputs:
                      targetPath: $(Build.SourcesDirectory)/all-npm-packages
                      artifact: all-npm-packages
                      publishLocation: pipeline

